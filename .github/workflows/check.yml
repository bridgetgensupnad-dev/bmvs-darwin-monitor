name: Check BMVS Darwin

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: bmvs-darwin-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.55.0

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: python -m playwright install chromium

      - name: Install Chromium system dependencies
        run: python -m playwright install-deps chromium

      - name: Check Darwin appointments
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BMVS_LOCATION: Darwin
          BMVS_POSTCODE: "0800"
          BMVS_EXAM_CODES: ${{ vars.BMVS_EXAM_CODES || '501,502' }}
          BUPA_HAP_ID: ${{ secrets.BUPA_HAP_ID }}
          BUPA_FIRST_NAME: ${{ secrets.BUPA_FIRST_NAME }}
          BUPA_LAST_NAME: ${{ secrets.BUPA_LAST_NAME }}
          BUPA_DOB: ${{ secrets.BUPA_DOB }}
          BUPA_PASSPORT: ${{ secrets.BUPA_PASSPORT }}
        run: python check_bmvs.py
